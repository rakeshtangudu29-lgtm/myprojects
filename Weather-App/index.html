<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Studio | Weather Hub</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --accent: #00f2fe;
            --bg: linear-gradient(135deg, #0f2027, #2c5364);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }

        .card {
            width: 360px; padding: 35px; border-radius: 30px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .search-area { display: flex; gap: 10px; margin-bottom: 20px; position: relative; z-index: 10; }
        input {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; outline: none;
        }
        button {
            padding: 12px 18px; border-radius: 12px; border: none;
            background: var(--accent); color: #000; font-weight: 700; cursor: pointer;
        }

        /* Weather Animation Area */
        #weather-icon-container {
            height: 80px; display: flex; justify-content: center; align-items: center;
            font-size: 50px; margin-bottom: 10px;
        }

        .animate-spin { animation: spin 10s linear infinite; }
        .animate-bounce { animation: bounce 2s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        .time { font-size: 3rem; font-weight: 800; margin: 5px 0; }
        .temp { font-size: 4rem; font-weight: 200; color: var(--accent); line-height: 1; }
        .city { font-size: 1.4rem; font-weight: 600; margin-top: 15px; }
        .stats { display: flex; justify-content: space-around; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="search-area">
        <input type="text" id="cityInput" placeholder="Enter City..." onkeydown="if(event.key==='Enter') fetchWeather()">
        <button onclick="fetchWeather()">GO</button>
    </div>

    <div id="weather-icon-container">🌍</div>

    <div id="dateText" style="opacity: 0.5; font-size: 0.8rem;">Awaiting Sync</div>
    <div class="time" id="timeText">00:00</div>
    <div class="temp" id="tempText">--°</div>
    
    <div class="city" id="cityText">Location</div>
    <div id="descText" style="font-style: italic; opacity: 0.7; font-size: 0.9rem;">Cloud Tech Edition</div>

    <div class="stats">
        <div><div style="font-size: 0.7rem; opacity: 0.5;">HUMIDITY</div><div id="humText">--%</div></div>
        <div><div style="font-size: 0.7rem; opacity: 0.5;">WIND</div><div id="windText">-- km/h</div></div>
    </div>
</div>

<script>
    // Remember to replace this with your actual key from WeatherAPI.com
    const KEY = "2b49377f8e1c4afba6761437262103"; 
    let clockInterval;

    async function fetchWeather() {
        const input = document.getElementById('cityInput');
        const city = input.value.trim();
        if (!city) return;

        try {
            const res = await fetch(`https://api.weatherapi.com/v1/current.json?key=${KEY}&q=${city}&aqi=no`);
            const data = await res.json();
            if (data.error) throw new Error(data.error.message);

            // Update Text
            document.getElementById('cityText').innerText = `${data.location.name}, ${data.location.country}`;
            document.getElementById('tempText').innerText = `${Math.round(data.current.temp_c)}°C`;
            document.getElementById('descText').innerText = data.current.condition.text;
            document.getElementById('humText').innerText = `${data.current.humidity}%`;
            document.getElementById('windText').innerText = `${data.current.wind_kph} km/h`;

            // Update Icon Animation
            updateIcon(data.current.condition.text.toLowerCase());

            // Clock Logic
            if (clockInterval) clearInterval(clockInterval);
            const offset = new Date(data.location.localtime) - new Date();
            clockInterval = setInterval(() => {
                const now = new Date(new Date().getTime() + offset);
                document.getElementById('dateText').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                document.getElementById('timeText').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            }, 1000);

        } catch (err) { alert(err.message); }
    }

    function updateIcon(condition) {
        const container = document.getElementById('weather-icon-container');
        if (condition.includes("sun") || condition.includes("clear")) {
            container.innerHTML = `<span class="animate-spin">☀️</span>`;
        } else if (condition.includes("rain") || condition.includes("drizzle")) {
            container.innerHTML = `<span class="animate-bounce">🌧️</span>`;
        } else if (condition.includes("cloud") || condition.includes("overcast")) {
            container.innerHTML = `<span class="animate-pulse">☁️</span>`;
        } else if (condition.includes("snow") || condition.includes("ice")) {
            container.innerHTML = `<span class="animate-bounce">❄️</span>`;
        } else {
            container.innerHTML = `🌍`;
        }
    }
</script>

</body>
</html>
